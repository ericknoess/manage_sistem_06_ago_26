{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Bi-semanal por Cuadrillas - Roster GxP</title>
    <link rel="stylesheet" href="{% static 'core/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'roster/css/bisemanal.css' %}">
    <!-- Sesión y permisos por rol (antes que los demás scripts: ajusta fetch con CSRF) -->
    <link rel="stylesheet" href="{% static 'core/css/sesion.css' %}">
    <script src="{% static 'core/js/sesion.js' %}"></script>
</head>
<body>

    <div class="header-bar">
        <div class="title">
            <a href="{% url 'inicio' %}" class="btn-inicio" title="Volver al menú principal">Menú principal</a>
            <span>📊 Consulta Bi-semanal por Cuadrillas (14 Días)</span>
        </div>
        <div class="nav-controls">
            <button class="btn" onclick="cambiarBloque(-14)">◀ 2 Semanas Anteriores</button>
            <button class="btn" onclick="irSemanaActual()">Esta Semana (Lunes)</button>
            <button class="btn" onclick="cambiarBloque(14)">2 Semanas Siguientes ▶</button>
            <a href="/roster/" class="btn btn-primary">Volver al Roster Operativo</a>
        </div>
    </div>

    <div class="table-container">
        <table id="biWeeklyTable">
            <thead>
                <tr id="tableHeaders">
                    <th class="operator-col">Colaborador / Cuadrilla</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="15" style="text-align:center; color: var(--muted); padding: 2rem;">Cargando matriz bi-semanal de turnos...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- CONTENEDOR PARA LA LEYENDA DE TURNOS -->
    <div id="leyendaGxpContainer" class="leyenda-container">
        <span style="font-style: italic;">Cargando catálogo de turnos...</span>
    </div>

    <script src="{% static 'core/js/utils.js' %}"></script>
    <script src="{% static 'roster/js/bisemanal.js' %}"></script>
</body>
</html>
