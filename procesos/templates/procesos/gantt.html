{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Gantt Chart - MES Upstream</title>
    <link rel="stylesheet" href="{% static 'core/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'procesos/css/gantt.css' %}">
    <!-- Sesión y permisos por rol (antes que los demás scripts: ajusta fetch con CSRF) -->
    <link rel="stylesheet" href="{% static 'core/css/sesion.css' %}">
    <script src="{% static 'core/js/sesion.js' %}"></script>
</head>
<body>

    <div class="header-toolbar">
        <div class="header-title">
            <a href="{% url 'inicio' %}" class="btn-inicio btn-inicio--arriba" title="Volver al menú principal">Menú principal</a>
            <h2>📊 Diagrama de Gantt - Master Level Scheduling</h2>
            <p>Monitoreo gerencial de Etapas ISA-88. Comparativa de Línea Base vs Reprogramación Real.</p>
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <div class="gantt-filtro">
                <label><input type="checkbox" id="chkGanttTodos"> Ver todos los lotes terminados</label>
                <span id="ganttOcultos" class="gantt-filtro__aviso"></span>
            </div>
            <a href="/planificacion/" class="btn-primary">⬅️ Volver a Planificación Diaria</a>
        </div>
    </div>

    <div class="gantt-wrapper">
        <div id="loadingState">Cargando matriz de datos MES...</div>
        
        <div class="gantt-scroll-area" id="ganttScrollArea" style="display: none;">
            <div class="gantt-sidebar" id="ganttSidebar">
                <div class="sidebar-header">Jerarquía de Lotes y Etapas</div>
                <div id="sidebarContent"></div>
            </div>

            <div class="gantt-timeline" id="ganttTimeline">
                <div class="gantt-grid-bg"></div>
                <div class="timeline-header" id="timelineHeader"></div>
                <div class="gantt-rows-container" id="timelineRows"></div>
            </div>
        </div>
    </div>

    <!-- CONTENEDOR DEL TOOLTIP FLOTANTE -->
    <div id="customGanttTooltip" class="custom-tooltip"></div>

    <script src="{% static 'core/js/utils.js' %}"></script>
    <script src="{% static 'procesos/js/gantt.js' %}"></script>
</body>
</html>
